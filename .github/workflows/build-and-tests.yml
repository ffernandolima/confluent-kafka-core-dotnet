name: build-and-tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    types: ["opened", "synchronize", "reopened"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Check Docker version
      run: docker --version

    - name: Start Docker Compose
      run: docker compose -f docker-compose.yml up -d

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Wait for services availability
      run: |
        for i in $(seq 1 60); do
          if docker exec kafka kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 \
            && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/subjects)" = "200" ] \
            && [ "$(docker exec redis redis-cli ping 2>/dev/null)" = "PONG" ]; then
            echo "Kafka, Schema Registry and Redis are ready after ~$((i * 2))s"
            exit 0
          fi
          sleep 2
        done
        echo "Services did not become ready in time" >&2
        docker ps -a
        exit 1
      shell: bash

    - name: Check containers
      run: docker ps -a

    - name: Run tests .NET 8
      run: dotnet test --framework net8.0 --configuration Release --no-build --verbosity normal --logger GitHubActions

    - name: Run tests .NET 9
      run: dotnet test --framework net9.0 --configuration Release --no-build --verbosity normal --logger GitHubActions

    - name: Run tests .NET 10
      run: dotnet test --framework net10.0 --configuration Release --no-build --verbosity normal --logger GitHubActions

    - name: Stop Docker Compose
      run: docker compose -f docker-compose.yml down

  build-and-publish:    
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-and-publish.yml
    with:
      PROJECT: Confluent.Kafka.Core
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}